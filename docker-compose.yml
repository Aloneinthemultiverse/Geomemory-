# Full GeoMemory stack. Start the services you need:
#   docker compose up -d db kafka          # backends only (run Python on your laptop)
#   docker compose up -d                    # everything, UI on http://localhost:8765
# Host ports can be changed: PG_PORT=5433 KAFKA_PORT=9093 docker compose up -d
services:
  db:
    build: ./docker/db
    environment:
      POSTGRES_USER: geomemory
      POSTGRES_PASSWORD: geomemory
      POSTGRES_DB: geomemory
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomemory -d geomemory"]
      interval: 3s
      retries: 40

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 4
    ports: ["${KAFKA_PORT:-9092}:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    depends_on:
      db: {condition: service_healthy}
      kafka: {condition: service_healthy}
    ports: ["${UI_PORT:-8765}:8765", "${API_PORT:-8000}:8000"]
    volumes: ["./data:/app/data", "./results:/app/results"]

volumes:
  pgdata:
